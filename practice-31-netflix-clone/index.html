<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <link type="text/css" rel="stylesheet"
        href="/web/20221230022610cs_/https://www.netflix.com/personalization/cl2/freeform/WebsiteDetect?source=wwwhead&amp;fetchType=css&amp;modalView=nmLanding"
        data-uia="botLink">
    <style>
        * {
            margin: 0;
            padding: 0;
            /* overflow-x: hidden; */
            font-family: Netflix Sans, Helvetica Neue, Segoe UI, Roboto, Ubuntu, sans-serif;
        }

        .section-1 {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;

        }

        .background {
            width: 100%;
            height: 100%;
            object-fit: cover;


        }

        .transparent {
            background-color: rgba(0, 0, 0, 0.61);
            /* background-image: linear-gradient(180deg, rgba(0, 0, 0, 0.438) , transparent 60%, rgba(0, 0, 0, 0.765)); */
            /* background-image: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.2)); */

            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            position: absolute;
        }

        .navbar {
            /* width:90vw; */
            z-index: 1;
            position: absolute;
            top: 5vh;
            left: 5vw;
            right: 5vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar .logo img {
            width: 85px;
        }

        .navbar .span-div {
            font-size: small;
            display: flex;
        }

        .navbar .span-div .span1 {
            color: white;
            border: 1px solid white;
            padding: 5px;
            background-color: black;
            margin-right: 1rem;
            display: flex;
            align-items: center;
            gap: 0.2rem;


        }

        .navbar .span-div .span2 {
            color: white;
            background-color: red;
            padding: 5px 20px;
            border: 1px solid red;
            /* box-sizing: border-box; */
            border-radius: 5px;
            display: flex;
            align-items: center;
        }

        .section-1-content {
            color: white;
            position: absolute;
            max-width: 440px;
            margin: auto;
            z-index: 1;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* align-content: center; */

        }

        .section-1-content .section-1-span1 {
            font-size: 2.8rem;
            font-weight:500;
            text-align: center;
            padding: 0;
            margin: 0;
            line-height:1;
        }

        .section-1-content .section-1-span2 {
            font-size:1.5rem ;
            margin-top: 1rem;
        }
        .section-1-content .section-1-span3{
            font-size:1.3rem ;
            text-align: center;
            margin-top: 0.8rem;
            max-width: 400px;
        }
    </style>
</head>

<body>
    <div>
        <div class="section-1">
            <nav class="navbar">
                <span class="logo">
                    <img src="assets/logo.svg" alt="logo">
                </span>
                <div class="span-div">
                    <div class="span1"><img src="assets/icons8-globe-24.png" alt="" width="12px">
                        English
                        <img src="assets/icons8-sort-down-24.png" alt="">
                    </div>
                    <div class="span2">Sign In</div>
                </div>
            </nav>
            <img class="background" src="assets/background-1.jpg" alt="background">

            <div class="transparent"></div>

            <div class="section-1-content">
                <h1 class=" section-1-span1"> Unlimited movies, TV shows, and more.</h1>
                <span class=" section-1-span2">Watch anywhere. Cancel anytime.</span>
                <span class=" section-1-span3">Ready to watch? Enter your email to create or restart your membership.</span>
            </div>
        </div>
        <!-- 
        <div class="section-2">

        </div> -->
    </div>
</body>

</html>
