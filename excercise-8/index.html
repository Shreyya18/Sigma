<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            position: relative;
            width:80vw;
            height: 50vh;
            background-color: blue;
        }
        .box{
            width: 50px;
            height: 50px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            left: 0;
            animation: right 5s linear 1s infinite normal ,up 1s ease-out 1s infinite alternate ;


        }
        @keyframes up {
            from{
            }
            to{
               bottom: 100%; 
            }
            

            
        }
        @keyframes right {
            from{
                left: 0;
            }
            to{
                left:100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
