<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            margin-top: 1rem;
            overflow-x: hidden;
        }
        .btn{
            display: flex;
            justify-content: center; 
            /* width: 20px; */
            /* margin: auto;*/
        }
        button{
            margin-top: 1rem;
            margin:  auto;
            margin-bottom: 1rem;
            width: 20rem;
            height: 2rem;
            display: flex;
            place-items: center;
            justify-content: center;
            position: sticky;
        }
        .card {
            width: 100vw;
            height: 30vh;
            background-color: black;
            display: flex;
            flex-direction: row;
            align-content: center;
            justify-items: center;
            padding: 2vh;
            color: white;
            margin-bottom: 1rem;

        }

        img {
            border-radius: 10px;

        }
        
        .image {
            position: relative;
            height: 100%;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }
        .image span{
            position: absolute;
            background-color: rgba(128, 128, 128, 0.825);
            border-radius: 5px;
            padding: 1px;
            color: black;
            /* top: 0;
            left: 0; */
            right:1rem;
            bottom: 2rem;

        }
    </style>
</head>

<body>
    <div class="btn">
    <button>CLick Me</button>
    </div>
    <div class="container">
       
    </div>
    <script src="script.js"></script>
</body>

</html>
